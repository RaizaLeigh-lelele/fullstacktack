        <!-- Contact Section -->
        <section id="contact" class="section">
            <div class="container">

                <h2 class="title">DON'T Contact Us</h2>

                <form action="#" method="post">

                    <!-- Name -->
                    <div class="field">
                        <label class="label" for="name">
                            NO Full Name
                        </label>

                        <div class="control">
                            <input
                                class="input"
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="field">
                        <label class="label" for="email">
                            NO Email Address
                        </label>

                        <div class="control">
                            <input
                                class="input"
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                            >
                        </div>
                    </div>

                    <!-- Message -->
                    <div class="field">
                        <label class="label" for="message">
                            NO Message
                        </label>

                        <div class="control">
                            <textarea
                                class="textarea"
                                id="message"
                                name="message"
                                placeholder="Write your message here"
                                required
                            ></textarea>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="field">
                        <div class="control">
                            <button
                                class="button is-primary"
                                type="submit"
                            >
                                DON'T Submit
                            </button>
                        </div>
                    </div>

                </form>
